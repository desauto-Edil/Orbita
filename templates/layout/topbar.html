<header class="topbar">
  <button type="button" class="topbar__menu-toggle" data-action="toggle-drawer"
          aria-label="Abrir navegación" aria-controls="sidebar-nav" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </svg>
  </button>

  <h1 class="topbar__title">{{ titulo_pagina|default:"Órbita" }}</h1>

  <div class="topbar__spacer"></div>

  {% comment %}
    Búsqueda y notificaciones: el espacio se reserva conceptualmente para
    cuando existan (Sprint 9 / Sprint 8), pero no se renderiza ningún
    control aquí todavía — evita que parezcan operativos sin serlo.
  {% endcomment %}

  <div class="dropdown" data-dropdown>
    <button type="button" class="dropdown__toggle" data-action="toggle-dropdown"
            aria-haspopup="true" aria-expanded="false">
      <span class="avatar" aria-hidden="true">{{ request.user.get_username|slice:":1"|upper }}</span>
      <span class="topbar__profile-name">{{ request.user.get_full_name|default:request.user.get_username }}</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </button>
    <div class="dropdown__menu" role="menu" hidden>
      <a role="menuitem" href="{% url 'core:perfil' %}">Mi perfil</a>
      <form method="post" action="{% url 'core:logout' %}" role="none">
        {% csrf_token %}
        <button type="submit" role="menuitem">Cerrar sesión</button>
      </form>
    </div>
  </div>
</header>
