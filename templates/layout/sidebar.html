<aside class="sidebar" id="sidebar-nav" aria-label="Navegación principal">
  <div class="sidebar__brand">
    <span class="sidebar__brand-mark" aria-hidden="true">O</span>
    <span class="sidebar__brand-name">Órbita</span>
  </div>
  <nav class="sidebar__nav">
    <ul>
      {% for item in nav_items %}
        <li>
          <a class="sidebar__item{% if request.resolver_match.view_name == item.url_name or item.namespace == request.resolver_match.namespace %} is-active{% endif %}"
             href="{% url item.url_name %}"
             {% if request.resolver_match.view_name == item.url_name or item.namespace == request.resolver_match.namespace %}aria-current="page"{% endif %}>
            <span class="sidebar__icon" aria-hidden="true">
              {% if item.icono == "home" %}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 11.5 12 4l8 7.5"/>
                  <path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/>
                </svg>
              {% elif item.icono == "servicios" %}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="8" height="8" rx="2"/>
                  <rect x="13" y="3" width="8" height="8" rx="2"/>
                  <rect x="3" y="13" width="8" height="8" rx="2"/>
                  <rect x="13" y="13" width="8" height="8" rx="2"/>
                </svg>
              {% elif item.icono == "settings" %}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
                </svg>
              {% elif item.icono == "tickets" %}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 6v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-6V7Z"/>
                  <path d="M10 6v12" stroke-dasharray="2 2"/>
                </svg>
              {% endif %}
            </span>
            <span class="sidebar__label">{{ item.etiqueta }}</span>
          </a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</aside>
