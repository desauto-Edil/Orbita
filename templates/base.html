{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Órbita{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <div class="app-shell">
    {% if user.is_authenticated %}{% include "layout/sidebar.html" %}{% endif %}
    <div class="app-shell__main">
      {% if user.is_authenticated %}{% include "layout/topbar.html" %}{% endif %}
      <main class="{% if user.is_authenticated %}content-area{% else %}bare-content{% endif %}" id="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
